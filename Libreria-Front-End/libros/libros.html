<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Conexión Escrita — Gestión de Libros</title>
  <link rel="stylesheet" href="/assets/css/estilo.css" />
</head>

<body class="page-dashboard">

  <header class="topbar">
    <div class="container topbar-inner">
      <div class="logo">
        <h2>Conexión Escrita</h2>
        <span class="muted small">Administrador</span>
      </div>
      <nav class="nav">
        <a href="/pages/admin/admin.html">Dashboard</a>
        <a href="/inventario/inventario.html">Inventario</a>
        <a href="/usuarios/crear_usuario.html">Usuarios</a>
        <a href="/materias_primas/materias_primas.html">Materias Primas</a>
        <a href="/puntos_ventas/puntos_venta.html">Puntos de venta</a>
        <a href="/libros/libros.html" class="active">Libros</a>
        <a href="/../../index.html" class="btn-sm ghost" onclick="logout()">Salir</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="panel">

      <div class="panel-row">
        <h3>Catálogo de Libros</h3>

        <form id="filterFormLibros" class="form-inline">
          <input name="q" placeholder="Buscar por nombre" />
          <button class="btn">Buscar</button>

          <button type="button" class="btn primary" onclick="window.location.href='nuevo_libro.html'">
            + Agregar Nuevo Libro
          </button>
        </form>
      </div>

      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Stock Total</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="tabla-libros-gestion">
            <tr><td colspan="5">Cargando libros...</td></tr>
          </tbody>
        </table>
      </div>

    </section>
  </main>

  <footer class="site-footer container">
    <small class="muted">Conexión Escrita — Gestión de Libros</small>
  </footer>

  <!-- ============================================================
       MODAL EDITAR LIBRO
  ============================================================ -->
  <div id="modalEditarLibro" class="modal hidden">
    <div class="modal-content">
      <h3>Editar Libro</h3>

      <label>Nombre</label>
      <input id="edit-nombre" type="text" />

      <label>Categoría</label>
      <input id="edit-categoria" type="text" />

      <label>Descripción</label>
      <textarea id="edit-descripcion"></textarea>

      <label>Precio</label>
      <input id="edit-precio" type="number" step="0.01" />

      <label>Páginas por libro</label>
      <input id="edit-paginas" type="number" min="1" />

      <div class="modal-actions">
        <button class="btn ghost" onclick="cerrarModalEditarLibro()">Cancelar</button>
        <button class="btn primary" onclick="guardarCambiosLibro()">Guardar</button>
      </div>
    </div>
  </div>

  <style>
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      width: 350px;
      border-radius: 8px;
    }
    .hidden { display: none; }
  </style>

  <!-- ============================================================
       PROTECCIÓN Y LOGOUT
  ============================================================ -->
  <script>
    function logout() {
      localStorage.removeItem("userRole");
      window.location.href = "index.html";
    }

    (function protegerRuta() {
      const rol = localStorage.getItem("userRole");
      if (rol !== "admin") {
        window.location.href = "index.html";
      }
    })();
  </script>

  <!-- ============================================================
       ARCHIVO JS PRINCIPAL
  ============================================================ -->
  <script src="libros.js"></script>

</body>
</html>
